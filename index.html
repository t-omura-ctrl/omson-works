<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OMSON. ワークス</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OMSON ワークス">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #err{display:none;font:14px/1.7 -apple-system,sans-serif;padding:24px;color:#1c2b3a}
</style>
</head>
<body>
<iframe id="app" title="OMSON. ワークス"></iframe>
<div id="err"></div>
<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzMfJ5Zyfv8w3-OZ07i4bs6Cvasrr0YdAvuxxFdDEOUW16eVErwOWd7nk96DU8qDP9D/exec';
  var f = document.getElementById('app');
  if (/^https:\/\/script\.google\.com\/.+\/exec/.test(GAS_URL)) {
    f.src = GAS_URL;
  } else {
    f.style.display = 'none';
    var e = document.getElementById('err'); e.style.display = 'block';
    e.textContent = 'index.html の GAS_URL に、GASのウェブアプリのURL（…/exec で終わるもの）を設定してください。';
  }
</script>
</body>
</html>
